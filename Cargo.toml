[workspace]
resolver = "2"
members = ["crates/rms-db", "crates/rms-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
duckdb = { version = "1.20000", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Windows: a scanner watching target\ can race rustc ("OS error 32"); one codegen unit avoids it.
[profile.dev.build-override]
codegen-units = 1
