[workspace]
resolver = "2"
members = ["crates/rms-db", "crates/rms-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
duckdb = { version = "1.20000", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Why target\ reached 35 GB: debug info (every test binary alone had a 500 MB .pdb, and DuckDB's C++ objects
# and rlib carried it too), and three separate DuckDB builds, one for each different `-p` selection of
# `cargo build/test/check`. No debug info, and always `--workspace` (see .cargo\config.toml), keeps one
# small copy. Breakpoint debugging of this code would need `debug = 1` here.
[profile.dev]
debug = 0

# Windows: a scanner watching target\ can race rustc ("OS error 32"); one codegen unit avoids it.
[profile.dev.build-override]
codegen-units = 1

# DuckDB's C++ engine compiled without optimisation is about 50x slower, which
# made a 3000-fill test take minutes. Optimise just that one dependency.
[profile.dev.package.libduckdb-sys]
opt-level = 2
